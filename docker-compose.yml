services:
  db:
    image: postgres:16-alpine
    container_name: ls_prep_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-concours_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: ls_prep_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: ls_prep_api
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 300 core.wsgi:application"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
