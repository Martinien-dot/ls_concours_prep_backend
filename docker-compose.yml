version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: concours_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-concours_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: concours_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
